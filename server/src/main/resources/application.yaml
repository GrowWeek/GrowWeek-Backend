spring:
  application:
    name: server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

gemini:
  api-key: ${GEMINI_API_KEY}
  base-url: https://generativelanguage.googleapis.com
  model: gemini-3-flash-preview
  thinking-level: low

management:
  endpoint:
    health:
      probes:
        enabled: true
